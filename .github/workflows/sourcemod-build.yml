name: SourceMod Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    paths:
      - .gitattributes
      - scripts/**
      - Makefile
      - addons/sourcemod/**
      - README.md
      - LICENSE
      - NOTICES.md
      - CHANGELOG.md
      - .github/workflows/**
      - tools/smoke/**
  workflow_dispatch:

concurrency:
  group: sourcemod-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCEMOD_VERSION: ${{ vars.SOURCEMOD_VERSION }}

jobs:
  deps-smx:
    runs-on: ubuntu-latest

    steps:
      - name: Validate organization SourceMod version
        shell: bash
        run: |
          if [[ ! "$SOURCEMOD_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Set the AoC-Gamers Actions variable SOURCEMOD_VERSION to a SourceMod branch such as 1.12."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SourceMod build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore SourceMod dependency cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ runner.os }}-smx-deps-${{ env.SOURCEMOD_VERSION }}-${{ hashFiles('scripts/deps/fetch-sourcemod.py', 'Makefile') }}

      - name: Resolve SourceMod dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: make deps-smx PYTHON=python3 SOURCEMOD_VERSION="${SOURCEMOD_VERSION}" SMX_PLATFORM=linux

      - name: Save SourceMod dependency cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build-smx:
    needs: deps-smx
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SourceMod build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore SourceMod dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ runner.os }}-smx-deps-${{ env.SOURCEMOD_VERSION }}-${{ hashFiles('scripts/deps/fetch-sourcemod.py', 'Makefile') }}
          fail-on-cache-miss: true

      - name: Build SourceMod plugin
        run: make build-smx PYTHON=python3

      - name: Upload SourceMod build tree
        uses: actions/upload-artifact@v6
        with:
          name: smx-build
          path: .build/smx
          if-no-files-found: error
          retention-days: 1

      - name: Upload SourceMod compile log
        uses: actions/upload-artifact@v6
        with:
          name: smx-compile-log
          path: .build/build-smx-compile.log
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build-smx
    runs-on: ubuntu-latest
    outputs:
      basename: ${{ steps.artifact.outputs.basename }}
      prerelease: ${{ steps.artifact.outputs.prerelease }}
      tag: ${{ steps.artifact.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SourceMod release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Download SourceMod build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/smx

      - name: Resolve artifact channel
        id: artifact
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main)
              echo "version=latest" >> "$GITHUB_OUTPUT"
              echo "basename=l4d2-player-skills-latest" >> "$GITHUB_OUTPUT"
              echo "tag=channel/latest" >> "$GITHUB_OUTPUT"
              echo "release_name=Latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "version=develop" >> "$GITHUB_OUTPUT"
              echo "basename=l4d2-player-skills-develop" >> "$GITHUB_OUTPUT"
              echo "tag=channel/develop" >> "$GITHUB_OUTPUT"
              echo "release_name=Develop" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=pr-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              echo "basename=l4d2-player-skills-pr-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Package SourceMod build tree
        run: make package-smx PYTHON=python3

      - name: Create release archive
        env:
          RELEASE_BASENAME: ${{ steps.artifact.outputs.basename }}
        run: make release PYTHON=python3 RELEASE_BASENAME="${RELEASE_BASENAME}"

      - name: Upload release zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.basename }}
          path: dist/release/${{ steps.artifact.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  publish-channel:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download validated ZIP
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.basename }}
          path: dist/release

      - name: Move channel tag
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ needs.package.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.package.outputs.tag }}" --force

      - name: Publish channel release
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          files: dist/release/${{ needs.package.outputs.basename }}.zip
          draft: false
          prerelease: ${{ needs.package.outputs.prerelease == 'true' }}
